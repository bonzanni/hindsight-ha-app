name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: hindsight/Dockerfile
          # DL3008: upstream nodesource install pins via the setup script, not apt.
          # DL3006/DL3007: base + upstream images are pinned via ARG (digest/dated tag).
          # DL4006: the nodesource `curl | bash` mirrors upstream's own install.
          # DL3059: build-smoke RUNs are kept separate on purpose (clear failure
          #         attribution — each proves one model/cache loads offline).
          ignore: DL3008,DL3006,DL3007,DL4006,DL3059

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck s6 + test scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # s6 run/finish/up scripts and the init use the bashio shebang
          # (#!/command/with-contenv bashio); SC1008 flags that non-standard
          # interpreter — suppress it and lint as bash.
          mapfile -t files < <(
            find hindsight/rootfs/etc/s6-overlay -type f \
              \( -name '*.sh' -o -name run -o -name finish -o -name up \)
            printf '%s\n' tests/smoke.sh tests/run-ingress.sh
          )
          echo "Linting: ${files[*]}"
          shellcheck -s bash -e SC1008 "${files[@]}"
