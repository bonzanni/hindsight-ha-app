name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: hindsight/Dockerfile
          # DL3008: upstream nodesource install pins via the setup script, not apt.
          # DL3006/DL3007: base + upstream images are pinned via ARG (digest/dated tag).
          # DL4006: the nodesource `curl | bash` mirrors upstream's own install.
          # DL3059: build-smoke RUNs are kept separate on purpose (clear failure
          #         attribution — each proves one model/cache loads offline).
          ignore: DL3008,DL3006,DL3007,DL4006,DL3059

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck s6 + test scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # s6 run/finish/up scripts and the init use the bashio shebang
          # (#!/command/with-contenv bashio); SC1008 flags that non-standard
          # interpreter — suppress it and lint as bash.
          mapfile -t files < <(
            find hindsight/rootfs/etc/s6-overlay -type f \
              \( -name '*.sh' -o -name run -o -name finish -o -name up \)
            find tests -type f -name '*.sh' -print
          )
          echo "Linting: ${files[*]}"
          shellcheck -s bash -e SC1008 "${files[@]}"

  home_assistant:
    name: Home Assistant app metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./hindsight"

  apparmor:
    name: AppArmor policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse policy and require bidirectional signals
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apparmor-utils
          grep -Eq '^[[:space:]]*signal[[:space:]]*\([^)]*(send[^)]*receive|receive[^)]*send)[^)]*\)' hindsight/apparmor.txt
          apparmor_parser -QK hindsight/apparmor.txt

  contract:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run packaging, documentation, and CI contracts
        run: |
          make contracts
          python3 tests/test_ci_contract.py
