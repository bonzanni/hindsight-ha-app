# Mimics HA ingress locally: serves the add-on UI under a path prefix, strips
# the prefix when proxying, and sets X-Ingress-Path so the add-on's nginx can
# rewrite root-absolute URLs/redirects. Run this container in the add-on's
# network namespace (docker run --network container:hs-smoke) so it reaches the
# add-on on 127.0.0.1:8099 — the only source the add-on's allow-list permits
# besides the HA Supervisor IP.
events {}
http {
  server {
    listen 8100;
    location /hassio-ingress-test/ {
      proxy_pass http://127.0.0.1:8099/;
      proxy_set_header X-Ingress-Path /hassio-ingress-test;
      proxy_set_header Host $http_host;
      proxy_set_header Accept-Encoding "";
    }
  }
}
