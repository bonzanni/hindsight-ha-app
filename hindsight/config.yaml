name: Hindsight
description: Agent memory (Hindsight) for Home Assistant
version: "0.3.0"
slug: hindsight
url: https://github.com/bonzanni/hindsight-ha-app
image: "ghcr.io/bonzanni/hindsight"
arch:
  - amd64
init: false
ingress: true
ingress_stream: true
panel_icon: mdi:brain
panel_title: Hindsight
ports:
  8888/tcp: null
ports_description:
  8888/tcp: Hindsight memory API (for other add-ons / LAN clients)
backup: cold
# Supervisor docker-stop grace (default 10s). Shutdown = uvicorn drain (<=5s)
# + worker drain (8s, HINDSIGHT_API_WORKER_SHUTDOWN_TIMEOUT) + pg0 checkpoint;
# 60s gives WAL-safe headroom so nightly cold backups never SIGKILL (137) pg0.
timeout: 60
hassio_api: true
options:
  openrouter_api_key: ""
  llm_model: "google/gemini-2.5-flash"
  llm_reasoning_effort: "low"
  reranker_enabled: true
  enable_ui: true
  log_level: "info"
schema:
  openrouter_api_key: password
  llm_model: str
  llm_reasoning_effort: list(low|medium|high)
  reranker_enabled: bool
  enable_ui: bool
  log_level: list(debug|info|warning|error|critical)
