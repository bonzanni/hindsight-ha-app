worker_processes 1;
error_log /proc/self/fd/2 warn;
pid /var/run/nginx-ingress.pid;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /proc/self/fd/1;
  sendfile on;

  upstream hindsight_cp  { server 127.0.0.1:9999; }
  upstream hindsight_api { server 127.0.0.1:8888; }

  server {
    listen 8099;
    # HA ingress only ever connects from the Supervisor.
    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;

    absolute_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Plain (uncompressed) upstream responses so sub_filter can rewrite them.
    proxy_set_header Accept-Encoding "";

    # API paths the UI uses (and handy for LAN/casa testing through ingress).
    location ~ ^/(health|metrics|openapi\.json|docs|redoc|v1|mcp)(/|$) {
      proxy_pass http://hindsight_api;
    }

    # Control-plane (Next.js). Rewrite root-absolute asset/API paths to carry
    # the dynamic ingress prefix supplied by HA in X-Ingress-Path.
    location / {
      proxy_pass http://hindsight_cp;
      # The CP issues root-absolute redirects (e.g. / -> 307 Location:/dashboard).
      # sub_filter only rewrites the body, not headers, so prefix the Location of
      # any redirect with the ingress path or the browser leaves the ingress mount.
      proxy_redirect ~^/(.*)$ $http_x_ingress_path/$1;
      sub_filter_once off;
      sub_filter_types text/html text/css application/javascript application/json;
      sub_filter 'href="/'  'href="$http_x_ingress_path/';
      sub_filter 'src="/'   'src="$http_x_ingress_path/';
      sub_filter '"/_next/' '"$http_x_ingress_path/_next/';
      sub_filter '"/api/'   '"$http_x_ingress_path/api/';
      # public/ assets the JS references as bare root-absolute literals (the HTML
      # copies are already caught by src=/href= above). Add new public assets
      # here if the ingress Playwright test reports them 404-ing at the root.
      sub_filter '"/logo.png"' '"$http_x_ingress_path/logo.png"';
    }
  }
}
