worker_processes 1;
error_log /proc/self/fd/2 warn;
pid /var/run/nginx-ingress.pid;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /proc/self/fd/1;
  sendfile on;

  upstream hindsight_cp  { server 127.0.0.1:9999; }
  upstream hindsight_api { server 127.0.0.1:8888; }

  server {
    listen 8099;
    # HA ingress only ever connects from the Supervisor.
    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;

    absolute_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Plain (uncompressed) upstream responses so sub_filter can rewrite them.
    proxy_set_header Accept-Encoding "";

    # API paths the UI uses (and handy for LAN/casa testing through ingress).
    location ~ ^/(health|metrics|openapi\.json|docs|redoc|v1|mcp)(/|$) {
      proxy_pass http://hindsight_api;
    }

    # The CP's basePath root (/__HA_INGRESS__/) 308-strips its trailing slash to
    # /__HA_INGRESS__, which 404s (the next-intl root redirect doesn't fire under
    # basePath) — so the bare ingress entry point would dead-end. Send it straight
    # to the dashboard (the app's landing), carrying the live ingress prefix.
    location = / {
      return 307 $http_x_ingress_path/dashboard;
    }

    # Control-plane (Next.js). The CP is rebuilt with basePath=/__HA_INGRESS__
    # (a placeholder), so it serves ALL routes/assets/RSC under that path and its
    # client router prefixes navigations with it. HA ingress already stripped the
    # real prefix from the request, so:
    #   1. re-add the placeholder before proxying (the CP expects /__HA_INGRESS__/*)
    #   2. sub_filter the placeholder -> the live X-Ingress-Path in every response
    #      body (covers HTML, JS, CSS, JSON and RSC 'text/x-component' payloads),
    #   3. proxy_redirect the placeholder in Location headers (body filter can't).
    location / {
      rewrite ^/(.*)$ /__HA_INGRESS__/$1 break;
      proxy_pass http://hindsight_cp;
      # Rewrite the placeholder in Location headers, with or without a trailing
      # path and whether relative or host-absolute (the CP 308s /__HA_INGRESS__/
      # -> /__HA_INGRESS__ then 307s to the dashboard).
      proxy_redirect ~^(https?://[^/]+)?/__HA_INGRESS__(/.*)?$ $http_x_ingress_path$2;
      sub_filter_once off;
      # (text/html is always filtered by default; listing it warns "duplicate")
      sub_filter_types text/css application/javascript text/javascript application/json text/x-component;
      sub_filter '/__HA_INGRESS__' '$http_x_ingress_path';
      # basePath prefixes navigation/assets/RSC but NOT client fetch() or public/
      # assets, which the CP references as raw root-absolute literals. Rewrite
      # those so the browser requests them under the ingress prefix too.
      # The CP's client builds /api/ URLs with BOTH double-quote and backtick
      # (template literal) string forms, e.g. fetchApi(`/api/graph?...`).
      sub_filter '"/api/'         '"$http_x_ingress_path/api/';
      sub_filter '`/api/'         '`$http_x_ingress_path/api/';
      sub_filter '"/favicon.png"' '"$http_x_ingress_path/favicon.png"';
      sub_filter '"/logo.png"'    '"$http_x_ingress_path/logo.png"';
    }
  }
}
